name: scrape

on:
  schedule:
    # Offset from the top of the hour so it doesn't double up with the
    # Railway :00 scheduler (and so a GH runner failure is distinguishable
    # from a Railway one in the logs).
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Scrape
        working-directory: backend
        run: python scraper.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}