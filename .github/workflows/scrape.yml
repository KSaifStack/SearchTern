name: Scrape

on:
  schedule:
    # :17, not :00. GitHub queues scheduled workflows and the top of the hour
    # is the most congested slot — an off-minute job starts materially sooner.
    - cron: '17 * * * *'
  workflow_dispatch: {}

# Never let two scrapes overlap. scraper.py also takes a Postgres advisory
# lock, but that only stops a second writer; this stops the second job burning
# a runner minute first.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Read by scraper.py; not needed here but keeps parity with the API.
          SCRAPER_MAX_AGE_DAYS: '90'
        run: python backend/scraper.py

      # The scrape wrote backend/recent.jobs.json (read_db.write_snapshot()).
      # Publish it to R2 as the CDN-served index, so the frontend — and any
      # number of visitors — read it from a zero-egress static object instead
      # of the API. Cache-Control is 1h to match the hourly scrape: browsers and
      # CDN POPs hold the file one hour, then refetch; stale-while-revalidate
      # serves instantly while a replaced object loads in the background.
      - name: Publish index to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3api put-object \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --bucket searchtern-jobs \
            --key jobs.json \
            --body backend/recent.jobs.json \
            --content-type application/json \
            --cache-control "public, max-age=3600, stale-while-revalidate=60"

      - name: Report
        if: always()
        run: echo "scraper.py prints its per-source RSS and row counts to this log."
