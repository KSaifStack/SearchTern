name: Scrape Jobs

on:
  schedule:
    # :17, not :00. GitHub queues scheduled workflows and the top of the hour
    # is the most congested slot — an off-minute job starts materially sooner.
    - cron: '17 * * * *'
  workflow_dispatch: {}

# Never let two triggers overlap the underlying scrape. The Railway function
# itself takes a Postgres advisory lock, but this avoids piling up redundant
# HTTP calls if a run hangs.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The actual scrape runs on Railway, where the function has direct
      # access to the Postgres database. This job is just a webhook trigger —
      # no DATABASE_URL, no local Python, no credentials beyond the API key
      # needed to authenticate the request.
      - name: Trigger Railway scraper
        run: |
          curl -sS -X POST "${{ secrets.SCRAPER_ENDPOINT }}" \
            -H "Authorization: Bearer ${{ secrets.SCRAPER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -w "\nResponse Status: %{http_code}\n" \
            --fail-with-body
