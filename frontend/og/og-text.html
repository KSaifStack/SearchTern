<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>SearchTern social preview — plain (1200x630)</title>
  <!--
    Plain variant of frontend/og/og-image.html: the same hero copy, centred on a
    white page, no board panel and no button. Renders to
    frontend/public/og-image.png at the size index.html and utils/seo.ts declare:

      chrome --headless=new --hide-scrollbars --window-size=1200,630 \
             --screenshot=frontend/public/og-image.png \
             file:///<abs path>/frontend/og/og-text.html

    Type and colour are the landing hero's: --text-dark #172b4d on
    "Find internships.", --accent-color #2d7a4f on "Track every application.",
    --text-muted #5e6c84 for the paragraph, Lexend at the site's weights.
  -->
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #ffffff;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .centered-text-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 1200px;
      height: 630px;
      padding: 0 96px;
      text-align: center;
      font-family: Lexend, "Segoe UI", system-ui, -apple-system, sans-serif;
      text-rendering: geometricPrecision;
    }

    h1 {
      color: #172b4d;
      font-size: 58px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.038em;
    }

    h1 .accent {
      display: block;
      color: #2d7a4f;
    }

    p {
      margin-top: 26px;
      max-width: 820px;
      color: #5e6c84;
      font-size: 22px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: -0.006em;
    }

    p .accent {
      color: #2d7a4f;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <div class="centered-text-card">
    <h1>Find internships. <span class="accent">Track every application.</span></h1>
    <p>
      Search and filter internships and new-grad roles from
      <span class="accent">45+</span> company ATS systems. Save roles and track
      applications in one free, open-source workspace, refreshed hourly.
    </p>
  </div>
</body>

</html>
