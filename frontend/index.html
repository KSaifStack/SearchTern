<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <!-- Google requires a square favicon that is a multiple of 48px to show it in
       search results; 96x96 is its recommended size. It also probes
       /favicon.ico directly rather than parsing the tags above, and falls back
       to a generic globe when that 404s, so that file carries the same art at
       multiple sizes too. -->
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/favicon-144x144.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Non-blocking font load: the stylesheet still downloads immediately but
       stops gating first paint on a round trip to Google. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet" />
  </noscript>
  <title>SearchTern | Open-Source Internship & New-Grad Tracker</title>
  <meta name="description" content="SearchTern pulls internships and new-grad roles directly from company ATS systems and adds H-1B sponsorship data where available. Free, open source, and built to track every application." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SearchTern | Open-Source Internship & New-Grad Tracker" />
  <meta property="og:description" content="Internships straight from company ATS systems, with H-1B sponsorship data where available. Free, open source, and no account needed to browse." />
  <meta property="og:url" content="https://searchtern.net" />
  <meta property="og:image" content="https://searchtern.net/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="SearchTern internship and new-grad job tracker" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SearchTern | Open-Source Internship & New-Grad Tracker" />
  <meta name="twitter:description" content="Internships straight from company ATS systems, with H-1B sponsorship data where available. Free, open source, and no account needed to browse." />
  <meta name="twitter:image" content="https://searchtern.net/og-image.png" />
  <script>
    // Set data-theme before first paint. ThemeProvider applies it from an
    // effect, which runs after the browser has already painted light, so every
    // dark-mode load would flash white without this.
    //
    // Both keys are required, and the marker is the point: the session hasn't
    // resolved yet, so this script can't tell a signed-in visitor's choice from
    // a leftover key written before the theme was gated. Anything written before
    // that gate lacks the marker and is ignored, so guests don't get painted dark
    // for the frames before ThemeProvider pins them to light.
    // Mirrors storedPreference() in ThemeContext — keep both keys in sync.
    try {
      if (localStorage.getItem('searchtern_theme_authed') === '1' &&
          localStorage.getItem('searchtern_theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) { /* private mode, storage disabled */ }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
