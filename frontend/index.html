<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <!-- Google probes /favicon.ico directly rather than parsing the tag above, and
       falls back to a generic globe when it 404s. Same art, multi-size. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Non-blocking font load: the stylesheet still downloads immediately but
       stops gating first paint on a round trip to Google. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet" />
  </noscript>
  <title>SearchTern — Software Internship & New-Grad Job Tracker</title>
  <meta name="description" content="SearchTern finds and tracks thousands of active software engineering internships and new-grad roles. Search by company, role, or location, and manage every application in one tracker." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SearchTern — Software Internship & New-Grad Job Tracker" />
  <meta property="og:description" content="Find thousands of active software internships and new-grad jobs, then track your applications in one place." />
  <meta property="og:url" content="https://searchtern.ksaif.dev" />
  <meta property="og:image" content="https://searchtern.ksaif.dev/favicon.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="SearchTern — Software Internship & New-Grad Job Tracker" />
  <meta name="twitter:description" content="Find thousands of active software internships and new-grad jobs, then track your applications in one place." />
  <script>
    // Set data-theme before first paint. ThemeProvider applies it from an
    // effect, which runs after the browser has already painted light, so every
    // dark-mode load would flash white without this. Mirrors storedPreference()
    // in ThemeContext — keep the storage key in sync.
    try {
      if (localStorage.getItem('searchtern_theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) { /* private mode, storage disabled */ }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
